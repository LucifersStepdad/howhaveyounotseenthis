  <br>
  <button id="go">Import all</button>
  <div id="log"></div>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const log = document.getElementById("log");

    document.getElementById("go").addEventListener("click", async () => {
      const lines = document.getElementById("list").value
        .split("\n")
        .map((l) => l.trim())
        .filter(Boolean);

      log.textContent = `Importing ${lines.length} titles...\n`;

      for (const line of lines) {
        const [title, year] = line.split("|").map((s) => s && s.trim());
        try {
          await db.collection("movies").add({
            title,
            year: year || null,
            addedBy: "Import",
            votes: 0,
            watched: false,
            review: "",
            reviewedBy: "",
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          log.textContent += `✓ ${title}\n`;
        } catch (err) {
          log.textContent += `✗ ${title} — ${err.message}\n`;
        }
      }
      log.textContent += "Done.";
    });
  </script>
